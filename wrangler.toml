name = "surge"
main = "worker/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# The built client. The Worker sits in front and only handles /api/*,
# handing everything else to these assets.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Leaderboard storage.
# Create it once with:  npx wrangler d1 create surge-db
# then paste the database_id it prints in below.
[[d1_databases]]
binding = "DB"
database_name = "surge-db"
database_id = "5343368a-ed43-4e02-94f7-c7802b74fa9d"
migrations_dir = "migrations"

[observability]
enabled = true
